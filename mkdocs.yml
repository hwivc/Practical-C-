site_name: Practical C++ with the Braccio Arm
site_description: Learn C++ from zero by programming a real 6-joint robotic arm — the Tinkerkit Braccio. HWIVC Community Edition.
site_author: Tambu Precious — Hardware Innovation Valley Community (HWIVC)
site_url: https://theafricanjiant.github.io/Practical-C-/
repo_url: https://github.com/TheAfricanJiant/Practical-C-
repo_name: TheAfricanJiant/Practical-C-
edit_uri: edit/main/docs/
copyright: >
  Community Edition by Tambu Precious &amp; the
  <a href="https://hwivc.org/">Hardware Innovation Valley Community</a>, Buea.
  BraccioV2 library &copy; Lukas Severinghaus (LGPL/GPL).

theme:
  name: material
  language: en
  logo: images/logo.svg
  favicon: images/logo.svg
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/TheAfricanJiant/Practical-C-
    - icon: fontawesome/brands/linkedin
      link: https://cm.linkedin.com/in/tambu-precious-29bb67217
    - icon: fontawesome/solid/globe
      link: https://hwivc.org/

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
