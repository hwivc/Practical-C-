  - Start Here:
      - Introduction: introduction.md
      - Course Roadmap: roadmap.md
      - Setting Up Your Tools: getting_started.md
      - Meet the Braccio Arm: hardware/meet_the_braccio.md
      - "Lesson 00: Make the Arm Move": hardware/first_move.md
  - "Part 1 · C++ Basics":
      - "01 · How C++ Becomes Motion": Part1_Cpp_Basics/lesson01_compiler.md
      - "02 · Variables, Types & Constants": Part1_Cpp_Basics/lesson02_variables.md
      - "03 · Decisions & Loops": Part1_Cpp_Basics/lesson03_control_flow.md
      - "04 · Functions": Part1_Cpp_Basics/lesson04_functions.md
      - "05 · Header & Source Files": Part1_Cpp_Basics/lesson05_headers.md
      - "06 · Include Guards": Part1_Cpp_Basics/lesson06_include_guards.md
      - "07 · The Preprocessor": Part1_Cpp_Basics/lesson07_preprocessor.md
  - "Part 2 · Classes":
      - "08 · Classes & Objects": Part2_OOP/lesson08_classes.md
      - "09 · Constructors": Part2_OOP/lesson09_constructors.md
      - "10 · Encapsulation & Safety Limits": Part2_OOP/lesson10_encapsulation.md
      - "11 · Methods, const & Overloading": Part2_OOP/lesson11_methods.md
  - "Part 3 · Memory":
      - "12 · Pointers": Part3_Memory/lesson12_pointers.md
      - "13 · References": Part3_Memory/lesson13_references.md
      - "14 · Stack, Heap & 2 KB of RAM": Part3_Memory/lesson14_dynamic_memory.md
      - "15 · Arrays & Joint State": Part3_Memory/lesson15_arrays.md
  - "Part 4 · Libraries":
      - "16 · The Arduino Build System": Part4_Arduino_Libraries/lesson16_arduino_ecosystem.md
      - "17 · Anatomy of a Library": Part4_Arduino_Libraries/lesson17_library_structure.md
      - "18 · Inside BraccioV2": Part4_Arduino_Libraries/lesson18_bracciov2_deep_dive.md
      - "19 · Writing MyBraccio": Part4_Arduino_Libraries/lesson19_coding_mybraccio.md
      - "20 · Deploy, Test & Debug": Part4_Arduino_Libraries/lesson20_deployment.md
  - Projects:
