<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" width="980" height="440" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Header vs. source: who declares, who defines">
<title>Header vs. source: who declares, who defines</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
  <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8601c"/></marker>
  <marker id="arrT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
  <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  <linearGradient id="orangeGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f27a3a"/><stop offset="1" stop-color="#d4501a"/></linearGradient>
  <linearGradient id="boardGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b8a95"/><stop offset="1" stop-color="#0d6d77"/></linearGradient>
</defs>
<rect x="1" y="1" width="978" height="438" rx="18" fill="#ffffff" stroke="#eadcd2" stroke-width="2"/>
<text x="32" y="46" font-size="22" font-weight="800" fill="#1f2937">Header vs. source: who declares, who defines</text>
<text x="32" y="72" font-size="14" fill="#64748b">Each .cpp is compiled on its own; the linker stitches them together</text>
<rect x="40" y="100" width="260" height="150" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="56" y="128" font-size="16" fill="#1f2937" font-weight="800" text-anchor="start" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">MyBraccio.h</text>
<text x="56" y="158" font-size="12.5" fill="#1f2937" font-weight="normal" text-anchor="start" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">class MyBraccio {</text>
<text x="56" y="180" font-size="12.5" fill="#1f2937" font-weight="normal" text-anchor="start" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">  void begin();</text>
<text x="56" y="202" font-size="12.5" fill="#1f2937" font-weight="normal" text-anchor="start" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">  void update();</text>
<text x="56" y="224" font-size="12.5" fill="#1f2937" font-weight="normal" text-anchor="start" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">};</text>
<text x="170" y="272" font-size="12.5" fill="#64748b" font-weight="700" text-anchor="middle">declarations — the menu</text>
<rect x="360" y="100" width="260" height="150" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="376" y="128" font-size="16" fill="#1f2937" font-weight="800" text-anchor="start" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">MyBraccio.cpp</text>
<text x="376" y="158" font-size="12.5" fill="#1f2937" font-weight="normal" text-anchor="start" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">#include "MyBraccio.h"</text>
<text x="376" y="180" font-size="12.5" fill="#1f2937" font-weight="normal" text-anchor="start" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">void MyBraccio::begin()</text>
<text x="376" y="202" font-size="12.5" fill="#1f2937" font-weight="normal" text-anchor="start" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">{ …attach servos… }</text>
<text x="490" y="272" font-size="12.5" fill="#64748b" font-weight="700" text-anchor="middle">definitions — the kitchen</text>
<rect x="680" y="100" width="260" height="150" rx="14" fill="#fff7f2" stroke="#e8601c" stroke-width="2"/>
<text x="696" y="128" font-size="16" fill="#1f2937" font-weight="800" text-anchor="start" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">sketch.ino</text>
<text x="696" y="158" font-size="12.5" fill="#1f2937" font-weight="normal" text-anchor="start" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">#include "MyBraccio.h"</text>
<text x="696" y="180" font-size="12.5" fill="#1f2937" font-weight="normal" text-anchor="start" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">MyBraccio arm;</text>
<text x="696" y="202" font-size="12.5" fill="#1f2937" font-weight="normal" text-anchor="start" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">arm.begin();</text>
<text x="810" y="272" font-size="12.5" fill="#64748b" font-weight="700" text-anchor="middle">uses it — the customer</text>
<path d="M300,160 C330,160 330,160 360,160" stroke="#d97706" stroke-width="2.5" fill="none" marker-end="url(#arr)" />
<path d="M170,250 C170,330 720,330 740,252" stroke="#d97706" stroke-width="2.5" fill="none" marker-end="url(#arr)" stroke-dasharray="6 5" />
<text x="190" y="350" font-size="12.5" fill="#d97706" font-weight="700" text-anchor="middle">#include copies the header's text into both files</text>
<rect x="360" y="350" width="260" height="60" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
<text x="490" y="376" font-size="15" fill="#0f766e" font-weight="800" text-anchor="middle">Linker</text>
<text x="490" y="396" font-size="12" fill="#1f2937" font-weight="normal" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">MyBraccio.o + sketch.o → firmware</text>
<line x1="490" y1="250" x2="490" y2="348" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr)"/>
<path d="M810,250 C810,380 700,380 622,380" stroke="#e8601c" stroke-width="2.5" fill="none" marker-end="url(#arrO)" />
</svg>
