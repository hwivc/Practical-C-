<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" width="980" height="480" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="How BraccioV2 moves smoothly: target vs. current">
<title>How BraccioV2 moves smoothly: target vs. current</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
  <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8601c"/></marker>
  <marker id="arrT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
  <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  <linearGradient id="orangeGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f27a3a"/><stop offset="1" stop-color="#d4501a"/></linearGradient>
  <linearGradient id="boardGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b8a95"/><stop offset="1" stop-color="#0d6d77"/></linearGradient>
</defs>
<rect x="1" y="1" width="978" height="478" rx="18" fill="#ffffff" stroke="#eadcd2" stroke-width="2"/>
<text x="32" y="46" font-size="22" font-weight="800" fill="#1f2937">How BraccioV2 moves smoothly: target vs. current</text>
<text x="32" y="72" font-size="14" fill="#64748b">Staircase = the real servo angle after each update() call</text>
<line x1="110" y1="420" x2="740" y2="420" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
<line x1="110" y1="420" x2="110" y2="130" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
<text x="740" y="446" font-size="13" fill="#64748b" font-weight="600" text-anchor="end">time →</text>
<text x="98" y="124" font-size="13" fill="#64748b" font-weight="600" text-anchor="end">angle</text>
<line x1="105" y1="376.9230769230769" x2="730" y2="376.9230769230769" stroke="#f1f5f9" stroke-width="1"/>
<text x="100" y="380.9230769230769" font-size="11" fill="#64748b" font-weight="normal" text-anchor="end">60°</text>
<line x1="105" y1="312.3076923076923" x2="730" y2="312.3076923076923" stroke="#f1f5f9" stroke-width="1"/>
<text x="100" y="316.3076923076923" font-size="11" fill="#64748b" font-weight="normal" text-anchor="end">90°</text>
<line x1="105" y1="247.69230769230768" x2="730" y2="247.69230769230768" stroke="#f1f5f9" stroke-width="1"/>
<text x="100" y="251.69230769230768" font-size="11" fill="#64748b" font-weight="normal" text-anchor="end">120°</text>
<line x1="105" y1="183.07692307692307" x2="730" y2="183.07692307692307" stroke="#f1f5f9" stroke-width="1"/>
<text x="100" y="187.07692307692307" font-size="11" fill="#64748b" font-weight="normal" text-anchor="end">150°</text>
<line x1="110.0" y1="183.07692307692307" x2="714.5" y2="183.07692307692307" stroke="#e8601c" stroke-width="2" stroke-dasharray="7 5"/>
<text x="714.5" y="175.07692307692307" font-size="12" fill="#b8470f" font-weight="700" text-anchor="end">base target = 150°</text>
<line x1="110.0" y1="376.9230769230769" x2="714.5" y2="376.9230769230769" stroke="#0f766e" stroke-width="2" stroke-dasharray="7 5"/>
<text x="714.5" y="394.9230769230769" font-size="12" fill="#0f766e" font-weight="700" text-anchor="end">elbow target = 60°</text>
<path d="M110.0,312.3 L148.8,312.3 L148.8,301.5 L187.5,301.5 L187.5,290.8 L226.2,290.8 L226.2,280.0 L265.0,280.0 L265.0,269.2 L303.8,269.2 L303.8,258.5 L342.5,258.5 L342.5,247.7 L381.2,247.7 L381.2,236.9 L420.0,236.9 L420.0,226.2 L458.8,226.2 L458.8,215.4 L497.5,215.4 L497.5,204.6 L536.2,204.6 L536.2,193.8 L575.0,193.8 L575.0,183.1 L714.5,183.1" stroke="#e8601c" stroke-width="3.5" fill="none" />
<path d="M110.0,312.3 L148.8,312.3 L148.8,323.1 L187.5,323.1 L187.5,333.8 L226.2,333.8 L226.2,344.6 L265.0,344.6 L265.0,355.4 L303.8,355.4 L303.8,366.2 L342.5,366.2 L342.5,376.9 L714.5,376.9" stroke="#0f766e" stroke-width="3.5" fill="none" />
<circle cx="110.0" cy="312.3076923076923" r="6" fill="#1f2937"/>
<line x1="342.5" y1="426" x2="342.5" y2="414" stroke="#1f2937" stroke-width="2"/>
<line x1="575.0" y1="426" x2="575.0" y2="414" stroke="#1f2937" stroke-width="2"/>
<text x="342.5" y="446" font-size="11" fill="#0f766e" font-weight="700" text-anchor="middle">elbow arrives</text>
<text x="575.0" y="446" font-size="11" fill="#b8470f" font-weight="700" text-anchor="middle">base arrives</text>
<rect x="760" y="120" width="190" height="280" rx="12" fill="#fff7f2" stroke="#f6d3c0" stroke-width="1.5"/>
<text x="776" y="150" font-size="13" fill="#b8470f" font-weight="800" text-anchor="start" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">setAllAbsolute(…)</text>
<text x="776" y="170" font-size="13" fill="#1f2937" font-weight="normal" text-anchor="start">only changes the</text>
<text x="776" y="190" font-size="13" fill="#1f2937" font-weight="normal" text-anchor="start">TARGET array.</text>
<text x="776" y="210" font-size="13" fill="#1f2937" font-weight="normal" text-anchor="start"></text>
<text x="776" y="230" font-size="13" fill="#b8470f" font-weight="800" text-anchor="start" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">Each update()</text>
<text x="776" y="250" font-size="13" fill="#1f2937" font-weight="normal" text-anchor="start">moves every joint</text>
<text x="776" y="270" font-size="13" fill="#1f2937" font-weight="normal" text-anchor="start">one delta (1°)</text>
<text x="776" y="290" font-size="13" fill="#1f2937" font-weight="normal" text-anchor="start">toward its target.</text>
<text x="776" y="310" font-size="13" fill="#1f2937" font-weight="normal" text-anchor="start"></text>
<text x="776" y="330" font-size="13" fill="#1f2937" font-weight="normal" text-anchor="start">Call update() every</text>
<text x="776" y="350" font-size="13" fill="#1f2937" font-weight="normal" text-anchor="start">10 ms → smooth,</text>
<text x="776" y="370" font-size="13" fill="#1f2937" font-weight="normal" text-anchor="start">simultaneous motion.</text>
</svg>
