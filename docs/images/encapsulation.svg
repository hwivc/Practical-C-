<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" width="980" height="440" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Encapsulation: data in a vault, methods as guarded doors">
<title>Encapsulation: data in a vault, methods as guarded doors</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
  <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8601c"/></marker>
  <marker id="arrT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
  <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  <linearGradient id="orangeGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f27a3a"/><stop offset="1" stop-color="#d4501a"/></linearGradient>
  <linearGradient id="boardGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b8a95"/><stop offset="1" stop-color="#0d6d77"/></linearGradient>
</defs>
<rect x="1" y="1" width="978" height="438" rx="18" fill="#ffffff" stroke="#eadcd2" stroke-width="2"/>
<text x="32" y="46" font-size="22" font-weight="800" fill="#1f2937">Encapsulation: data in a vault, methods as guarded doors</text>
<text x="32" y="72" font-size="14" fill="#64748b">Why BraccioV2 keeps its arrays private and clamps every angle</text>
<rect x="300" y="100" width="380" height="300" rx="22" fill="#fff7f2" stroke="#e8601c" stroke-width="3"/>
<text x="490" y="132" font-size="18" fill="#b8470f" font-weight="800" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">class Joint</text>
<rect x="340" y="150" width="300" height="150" rx="14" fill="#ffffff" stroke="#f6d3c0" stroke-width="2" stroke-dasharray="6 5"/>
<text x="490" y="176" font-size="13" fill="#64748b" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">private:  (the vault)</text>
<text x="370" y="206" font-size="14" fill="#1f2937" font-weight="600" text-anchor="start" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">int _angle   = 90;</text>
<text x="370" y="228" font-size="14" fill="#1f2937" font-weight="600" text-anchor="start" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">int _min     = 15;</text>
<text x="370" y="250" font-size="14" fill="#1f2937" font-weight="600" text-anchor="start" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">int _max     = 165;</text>
<text x="370" y="272" font-size="14" fill="#1f2937" font-weight="600" text-anchor="start" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">uint8_t _pin = 10;</text>
<text x="490" y="330" font-size="13" fill="#64748b" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">public:  (the doors)</text>
<rect x="330" y="342" width="150" height="40" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
<text x="405" y="367" font-size="14" fill="#0f766e" font-weight="800" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">setAngle(a)</text>
<rect x="500" y="342" width="150" height="40" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="575" y="367" font-size="14" fill="#2563eb" font-weight="800" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">getAngle()</text>
<rect x="40" y="160" width="200" height="60" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
<text x="140" y="186" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">joint.setAngle(200)</text>
<text x="140" y="206" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle">from loop()</text>
<path d="M240,190 C300,190 300,362 330,362" stroke="#0f766e" stroke-width="2.5" fill="none" marker-end="url(#arrT)" />
<text x="140" y="248" font-size="12" fill="#0f766e" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">checked: 200 → 165</text>
<rect x="40" y="280" width="200" height="60" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
<text x="140" y="306" font-size="13" fill="#dc2626" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">joint._angle = 200;</text>
<text x="140" y="326" font-size="12" fill="#dc2626" font-weight="700" text-anchor="middle">✗ compile error</text>
<line x1="240" y1="310" x2="336" y2="240" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr)" stroke-dasharray="6 4"/>
<text x="700" y="190" font-size="14" fill="#1f2937" font-weight="700" text-anchor="start">Only the class's own</text>
<text x="700" y="212" font-size="14" fill="#1f2937" font-weight="700" text-anchor="start">methods can touch the</text>
<text x="700" y="234" font-size="14" fill="#1f2937" font-weight="700" text-anchor="start">data — so a bad angle</text>
<text x="700" y="256" font-size="14" fill="#1f2937" font-weight="700" text-anchor="start">can never reach the</text>
<text x="700" y="278" font-size="14" fill="#b8470f" font-weight="800" text-anchor="start">servo and break a gear.</text>
</svg>
