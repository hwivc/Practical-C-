<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Inverse kinematics: from a point in space to joint angles">
<title>Inverse kinematics: from a point in space to joint angles</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
  <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8601c"/></marker>
  <marker id="arrT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
  <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  <linearGradient id="orangeGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f27a3a"/><stop offset="1" stop-color="#d4501a"/></linearGradient>
  <linearGradient id="boardGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b8a95"/><stop offset="1" stop-color="#0d6d77"/></linearGradient>
</defs>
<rect x="1" y="1" width="978" height="558" rx="18" fill="#ffffff" stroke="#eadcd2" stroke-width="2"/>
<text x="32" y="46" font-size="22" font-weight="800" fill="#1f2937">Inverse kinematics: from a point in space to joint angles</text>
<text x="32" y="72" font-size="14" fill="#64748b">Project 5 turns this picture into ~40 lines of C++</text>
<text x="60" y="110" font-size="15" fill="#1f2937" font-weight="800" text-anchor="start">Side view (shoulder + elbow)</text>
<line x1="60" y1="440" x2="520" y2="440" stroke="#cbd5e1" stroke-width="2"/>
<line x1="150" y1="440" x2="510" y2="440" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrG)" stroke-dasharray="4 4"/>
<text x="500" y="460" font-size="12" fill="#64748b" font-weight="600" text-anchor="end">x (forward)</text>
<line x1="150" y1="440" x2="150" y2="130" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrG)" stroke-dasharray="4 4"/>
<text x="158" y="140" font-size="12" fill="#64748b" font-weight="600" text-anchor="start">z (up)</text>
<line x1="150" y1="440" x2="330" y2="250" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 5"/>
<text x="256.0" y="365.0" font-size="18" fill="#2563eb" font-weight="800" text-anchor="start" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-style="italic">r</text>
<line x1="150" y1="440" x2="161.2" y2="270.4" stroke="#e8601c" stroke-width="16" stroke-linecap="round"/>
<line x1="161.2" y1="270.4" x2="330" y2="250" stroke="#e8601c" stroke-width="13" stroke-linecap="round"/>
<text x="129.61246723611293" y="355.1854952763175" font-size="16" fill="#b8470f" font-weight="800" text-anchor="start" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">L1</text>
<text x="249.61246723611293" y="248.1854952763175" font-size="16" fill="#b8470f" font-weight="800" text-anchor="start" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">L2</text>
<circle cx="150" cy="440" r="13" fill="#1f2937"/>
<circle cx="150" cy="440" r="5.9" fill="#cbd5e1"/>
<circle cx="161.22493447222587" cy="270.370990552635" r="11" fill="#1f2937"/>
<circle cx="161.22493447222587" cy="270.370990552635" r="5.0" fill="#cbd5e1"/>
<circle cx="330" cy="250" r="10" fill="none" stroke="#dc2626" stroke-width="3"/>
<circle cx="330" cy="250" r="3" fill="#dc2626"/>
<text x="346" y="244" font-size="13" fill="#dc2626" font-weight="800" text-anchor="start">target (x, z)</text>
<path d="M200,440 A50,50 0 0 0 153.3,390.1" stroke="#0f766e" stroke-width="2.5" fill="none"/>
<text x="208" y="420" font-size="17" fill="#0f766e" font-weight="800" text-anchor="start">θ₁</text>
<line x1="161.22493447222587" y1="270.370990552635" x2="165.84696631373063" y2="200.5237513684259" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4"/>
<path d="M163.9,230.5 A40,40 0 0 1 200.9,265.6" stroke="#0f766e" stroke-width="2.5" fill="none"/>
<text x="209.22493447222587" y="240.37099055263502" font-size="17" fill="#0f766e" font-weight="800" text-anchor="start">θ₂</text>
<text x="560" y="110" font-size="15" fill="#1f2937" font-weight="800" text-anchor="start">Top view (base)</text>
<circle cx="720" cy="330" r="46" fill="url(#orangeGrad)" stroke="#b8470f" stroke-width="2"/>
<line x1="720" y1="330" x2="920" y2="330" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrG)" stroke-dasharray="4 4"/>
<text x="920" y="350" font-size="12" fill="#64748b" font-weight="600" text-anchor="end">x</text>
<line x1="720" y1="330" x2="720" y2="140" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrG)" stroke-dasharray="4 4"/>
<text x="728" y="150" font-size="12" fill="#64748b" font-weight="600" text-anchor="start">y</text>
<line x1="720" y1="330" x2="870" y2="210" stroke="#e8601c" stroke-width="12"/>
<circle cx="870" cy="210" r="9" fill="none" stroke="#dc2626" stroke-width="3"/>
<text x="884" y="204" font-size="13" fill="#dc2626" font-weight="800" text-anchor="start">(x, y)</text>
<path d="M800,330 A80,80 0 0 0 782.5,280.0" stroke="#0f766e" stroke-width="2.5" fill="none"/>
<text x="808" y="304" font-size="13" fill="#0f766e" font-weight="800" text-anchor="start">base = atan2(y, x)</text>
<rect x="560" y="410" width="390" height="118" rx="12" fill="#fff7f2" stroke="#f6d3c0" stroke-width="1.5"/>
<text x="580" y="438" font-size="13.5" fill="#1f2937" font-weight="700" text-anchor="start">1. Turn the base to face the target.</text>
<text x="580" y="462" font-size="13.5" fill="#1f2937" font-weight="700" text-anchor="start">2. Solve the 2-link triangle (L1, L2, r)</text>
<text x="580" y="482" font-size="13.5" fill="#1f2937" font-weight="normal" text-anchor="start">    with the law of cosines → θ₁, θ₂.</text>
<text x="580" y="506" font-size="13.5" fill="#1f2937" font-weight="700" text-anchor="start">3. Convert θ to servo degrees &amp; clamp.</text>
</svg>
