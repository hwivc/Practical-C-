<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" width="980" height="360" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Soft-start: waking the motors gently">
<title>Soft-start: waking the motors gently</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
  <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8601c"/></marker>
  <marker id="arrT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
  <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  <linearGradient id="orangeGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f27a3a"/><stop offset="1" stop-color="#d4501a"/></linearGradient>
  <linearGradient id="boardGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b8a95"/><stop offset="1" stop-color="#0d6d77"/></linearGradient>
</defs>
<rect x="1" y="1" width="978" height="358" rx="18" fill="#ffffff" stroke="#eadcd2" stroke-width="2"/>
<text x="32" y="46" font-size="22" font-weight="800" fill="#1f2937">Soft-start: waking the motors gently</text>
<text x="32" y="72" font-size="14" fill="#64748b">What begin() does to pin 12 for ~6 seconds before the arm moves</text>
<rect x="70" y="96" width="272" height="190" rx="10" fill="#fcfcfd" stroke="#ece3dc" stroke-width="1.5"/>
<text x="82" y="118" font-size="14" fill="#1f2937" font-weight="800" text-anchor="start">Phase 1 · 0–2 s</text>
<text x="82" y="138" font-size="12" fill="#b8470f" font-weight="600" text-anchor="start" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">_softwarePWM(80, 450)</text>
<text x="82" y="156" font-size="11.5" fill="#64748b" font-weight="700" text-anchor="start">≈15% on</text>
<rect x="350" y="96" width="372" height="190" rx="10" fill="#fcfcfd" stroke="#ece3dc" stroke-width="1.5"/>
<text x="362" y="118" font-size="14" fill="#1f2937" font-weight="800" text-anchor="start">Phase 2 · 2–6 s</text>
<text x="362" y="138" font-size="12" fill="#b8470f" font-weight="600" text-anchor="start" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">_softwarePWM(75, 430)</text>
<text x="362" y="156" font-size="11.5" fill="#64748b" font-weight="700" text-anchor="start">≈15% on</text>
<rect x="730" y="96" width="212" height="190" rx="10" fill="#fcfcfd" stroke="#ece3dc" stroke-width="1.5"/>
<text x="742" y="118" font-size="14" fill="#1f2937" font-weight="800" text-anchor="start">Phase 3 · 6 s →</text>
<text x="742" y="138" font-size="12" fill="#b8470f" font-weight="600" text-anchor="start" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">digitalWrite(12, HIGH)</text>
<text x="742" y="156" font-size="11.5" fill="#64748b" font-weight="700" text-anchor="start">100% on</text>
<path d="M76,250 L86,250 L86,170 L94,170 L94,250 L134,250 L134,170 L142,170 L142,250 L182,250 L182,170 L190,170 L190,250 L230,250 L230,170 L238,170 L238,250 L278,250 L278,170 L286,170 L286,250 L366,250 L366,170 L374,170 L374,250 L414,250 L414,170 L422,170 L422,250 L462,250 L462,170 L470,170 L470,250 L510,250 L510,170 L518,170 L518,250 L558,250 L558,170 L566,170 L566,250 L606,250 L606,170 L614,170 L614,250 L654,250 L654,170 L662,170 L662,250 L742,250 L742,170 L936,170" stroke="#e8601c" stroke-width="3" fill="none" />
<text x="62" y="174" font-size="11" fill="#64748b" font-weight="700" text-anchor="end">HIGH</text>
<text x="62" y="254" font-size="11" fill="#64748b" font-weight="700" text-anchor="end">LOW</text>
<text x="32" y="320" font-size="13" fill="#64748b" font-weight="normal" text-anchor="start">Pin 12 drives the shield's power switch. Pulsing it first lets the servos' capacitors charge gently,</text>
<text x="32" y="340" font-size="13" fill="#64748b" font-weight="normal" text-anchor="start">so the arm doesn't jump and the Arduino doesn't reset from the current spike. (Pulses not to scale.)</text>
</svg>
