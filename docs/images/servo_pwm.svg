<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="How a servo knows which angle to go to">
<title>How a servo knows which angle to go to</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
  <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8601c"/></marker>
  <marker id="arrT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
  <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  <linearGradient id="orangeGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f27a3a"/><stop offset="1" stop-color="#d4501a"/></linearGradient>
  <linearGradient id="boardGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b8a95"/><stop offset="1" stop-color="#0d6d77"/></linearGradient>
</defs>
<rect x="1" y="1" width="978" height="518" rx="18" fill="#ffffff" stroke="#eadcd2" stroke-width="2"/>
<text x="32" y="46" font-size="22" font-weight="800" fill="#1f2937">How a servo knows which angle to go to</text>
<text x="32" y="72" font-size="14" fill="#64748b">Pulse-width signal on the servo's yellow/orange wire (pulse widths drawn wider than scale)</text>
<text x="40" y="160" font-size="14" fill="#1f2937" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">servo.write(0)</text>
<text x="40" y="182" font-size="13" fill="#64748b" font-weight="normal" text-anchor="start">pulse ≈0.5 ms</text>
<path d="M205,190 L205.0,190 L205.0,140 L233.1248,140 L233.1248,190 L451.75,190 L451.75,140 L479.8748,140 L479.8748,190 L695,190" stroke="#e8601c" stroke-width="3.5" fill="none" />
<line x1="205" y1="206" x2="233.1248" y2="206" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="219.0624" y="224" font-size="11" fill="#1f2937" font-weight="700" text-anchor="middle">≈0.5 ms</text>
<line x1="205" y1="126" x2="451.75" y2="126" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrG)" marker-start="url(#arrG)"/>
<text x="322.5" y="120" font-size="11" fill="#64748b" font-weight="600" text-anchor="middle">one period = 20 ms (50 pulses per second)</text>
<circle cx="800" cy="182" r="48" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
<path d="M844,182 A44,44 0 0 0 756,182" stroke="#e2e8f0" stroke-width="6" fill="none"/>
<line x1="800" y1="182" x2="840.0" y2="182.0" stroke="#e8601c" stroke-width="10" stroke-linecap="round"/>
<circle cx="800" cy="182" r="9" fill="#1f2937"/>
<text x="870" y="188" font-size="22" fill="#b8470f" font-weight="800" text-anchor="start">0°</text>
<text x="40" y="285" font-size="14" fill="#1f2937" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">servo.write(90)</text>
<text x="40" y="307" font-size="13" fill="#64748b" font-weight="normal" text-anchor="start">pulse ≈1.5 ms</text>
<path d="M205,315 L205.0,315 L205.0,265 L280.999,265 L280.999,315 L451.75,315 L451.75,265 L527.749,265 L527.749,315 L695,315" stroke="#e8601c" stroke-width="3.5" fill="none" />
<line x1="205" y1="331" x2="280.999" y2="331" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="242.9995" y="349" font-size="11" fill="#1f2937" font-weight="700" text-anchor="middle">≈1.5 ms</text>
<circle cx="800" cy="307" r="48" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
<path d="M844,307 A44,44 0 0 0 756,307" stroke="#e2e8f0" stroke-width="6" fill="none"/>
<line x1="800" y1="307" x2="800.0" y2="267.0" stroke="#e8601c" stroke-width="10" stroke-linecap="round"/>
<circle cx="800" cy="307" r="9" fill="#1f2937"/>
<text x="870" y="313" font-size="22" fill="#b8470f" font-weight="800" text-anchor="start">90°</text>
<text x="40" y="410" font-size="14" fill="#1f2937" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">servo.write(180)</text>
<text x="40" y="432" font-size="13" fill="#64748b" font-weight="normal" text-anchor="start">pulse ≈2.4 ms</text>
<path d="M205,440 L205.0,440 L205.0,390 L329.08000000000004,390 L329.08000000000004,440 L451.75,440 L451.75,390 L575.83,390 L575.83,440 L695,440" stroke="#e8601c" stroke-width="3.5" fill="none" />
<line x1="205" y1="456" x2="329.08000000000004" y2="456" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="267.04" y="474" font-size="11" fill="#1f2937" font-weight="700" text-anchor="middle">≈2.4 ms</text>
<circle cx="800" cy="432" r="48" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
<path d="M844,432 A44,44 0 0 0 756,432" stroke="#e2e8f0" stroke-width="6" fill="none"/>
<line x1="800" y1="432" x2="760.0" y2="432.0" stroke="#e8601c" stroke-width="10" stroke-linecap="round"/>
<circle cx="800" cy="432" r="9" fill="#1f2937"/>
<text x="870" y="438" font-size="22" fill="#b8470f" font-weight="800" text-anchor="start">180°</text>
<text x="40" y="500" font-size="13" fill="#64748b" font-weight="normal" text-anchor="start">The Servo library turns an angle into a pulse width (default 544–2400 µs). The servo's own circuit holds that angle.</text>
</svg>
