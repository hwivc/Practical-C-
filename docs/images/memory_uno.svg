<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="The three memories inside an Arduino UNO">
<title>The three memories inside an Arduino UNO</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
  <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8601c"/></marker>
  <marker id="arrT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
  <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  <linearGradient id="orangeGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f27a3a"/><stop offset="1" stop-color="#d4501a"/></linearGradient>
  <linearGradient id="boardGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b8a95"/><stop offset="1" stop-color="#0d6d77"/></linearGradient>
</defs>
<rect x="1" y="1" width="978" height="558" rx="18" fill="#ffffff" stroke="#eadcd2" stroke-width="2"/>
<text x="32" y="46" font-size="22" font-weight="800" fill="#1f2937">The three memories inside an Arduino UNO</text>
<text x="32" y="72" font-size="14" fill="#64748b">Not to scale · where your variables actually live</text>
<text x="130" y="118" font-size="16" fill="#1f2937" font-weight="800" text-anchor="middle">Flash</text>
<text x="130" y="138" font-size="13" fill="#64748b" font-weight="600" text-anchor="middle">32 KB</text>
<rect x="40" y="152" width="180" height="142.10526315789474" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="130" y="224.05263157894737" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">free</text>
<rect x="40" y="294.10526315789474" width="180" height="47.36842105263158" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="130" y="318.7894736842105" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">string literals</text>
<text x="130" y="335.7894736842105" font-size="11" fill="#64748b" font-weight="normal" text-anchor="middle">F("...") keeps them here</text>
<rect x="40" y="341.4736842105263" width="180" height="142.10526315789474" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="130" y="413.52631578947364" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">your program code</text>
<text x="130" y="430.52631578947364" font-size="11" fill="#64748b" font-weight="normal" text-anchor="middle">setup(), loop(), classes</text>
<rect x="40" y="483.57894736842104" width="180" height="28.42105263157895" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
<text x="130" y="498.7894736842105" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">bootloader</text>
<text x="130" y="536.0" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle">survives power-off</text>
<text x="380" y="118" font-size="16" fill="#1f2937" font-weight="800" text-anchor="middle">SRAM</text>
<text x="380" y="138" font-size="13" fill="#64748b" font-weight="600" text-anchor="middle">2 KB (2048 bytes!)</text>
<rect x="290" y="152" width="180" height="98.8235294117647" rx="6" fill="#fff7f2" stroke="#e8601c" stroke-width="1.5"/>
<text x="380" y="202.41176470588235" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">stack ↓</text>
<text x="380" y="219.41176470588235" font-size="11" fill="#64748b" font-weight="normal" text-anchor="middle">local variables, calls</text>
<rect x="290" y="250.8235294117647" width="180" height="112.94117647058825" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="380" y="308.29411764705884" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">free space</text>
<text x="380" y="325.29411764705884" font-size="11" fill="#64748b" font-weight="normal" text-anchor="middle">stack and heap grow toward it</text>
<rect x="290" y="363.7647058823529" width="180" height="56.47058823529412" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<text x="380" y="393.0" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">heap ↑</text>
<text x="380" y="410.0" font-size="11" fill="#64748b" font-weight="normal" text-anchor="middle">new / malloc (avoid!)</text>
<rect x="290" y="420.2352941176471" width="180" height="91.76470588235294" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="380" y="467.11764705882354" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">globals &amp; statics</text>
<text x="380" y="484.11764705882354" font-size="11" fill="#64748b" font-weight="normal" text-anchor="middle">Braccio arm; int poses[..]</text>
<text x="380" y="536.0" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle">wiped on reset</text>
<text x="630" y="118" font-size="16" fill="#1f2937" font-weight="800" text-anchor="middle">EEPROM</text>
<text x="630" y="138" font-size="13" fill="#64748b" font-weight="600" text-anchor="middle">1 KB</text>
<rect x="540" y="152" width="180" height="90.0" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="630" y="198.0" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">saved poses</text>
<text x="630" y="215.0" font-size="11" fill="#64748b" font-weight="normal" text-anchor="middle">EEPROM.put / get</text>
<rect x="540" y="242.0" width="180" height="270.0" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="630" y="378.0" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">free</text>
<text x="630" y="536.0" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle">survives power-off</text>
<rect x="760" y="150" width="190" height="300" rx="12" fill="#fff7f2" stroke="#f6d3c0" stroke-width="1.5"/>
<text x="776" y="180" font-size="13" fill="#b8470f" font-weight="800" text-anchor="start">Arduino UNO</text>
<text x="776" y="202" font-size="13" fill="#b8470f" font-weight="800" text-anchor="start">(ATmega328P)</text>
<text x="776" y="224" font-size="13" fill="#1f2937" font-weight="normal" text-anchor="start"></text>
<text x="776" y="246" font-size="13" fill="#1f2937" font-weight="normal" text-anchor="start">An int is 2 bytes</text>
<text x="776" y="268" font-size="13" fill="#1f2937" font-weight="normal" text-anchor="start">here — not 4 like</text>
<text x="776" y="290" font-size="13" fill="#1f2937" font-weight="normal" text-anchor="start">on your PC.</text>
<text x="776" y="312" font-size="13" fill="#1f2937" font-weight="normal" text-anchor="start"></text>
<text x="776" y="334" font-size="13" fill="#1f2937" font-weight="normal" text-anchor="start">If stack meets heap</text>
<text x="776" y="356" font-size="13" fill="#1f2937" font-weight="normal" text-anchor="start">the sketch crashes</text>
<text x="776" y="378" font-size="13" fill="#1f2937" font-weight="normal" text-anchor="start">silently. Keep RAM</text>
<text x="776" y="400" font-size="13" fill="#1f2937" font-weight="normal" text-anchor="start">use low!</text>
</svg>
