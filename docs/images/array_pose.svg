<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="An array is a row of same-typed boxes">
<title>An array is a row of same-typed boxes</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
  <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8601c"/></marker>
  <marker id="arrT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
  <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  <linearGradient id="orangeGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f27a3a"/><stop offset="1" stop-color="#d4501a"/></linearGradient>
  <linearGradient id="boardGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b8a95"/><stop offset="1" stop-color="#0d6d77"/></linearGradient>
</defs>
<rect x="1" y="1" width="978" height="328" rx="18" fill="#ffffff" stroke="#eadcd2" stroke-width="2"/>
<text x="32" y="46" font-size="22" font-weight="800" fill="#1f2937">An array is a row of same-typed boxes</text>
<text x="32" y="72" font-size="14" fill="#64748b">Storing a whole arm pose in one variable (this is Braccio's safety pose)</text>
<text x="32" y="118" font-size="16" fill="#1f2937" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">int pose[6] = {90, 45, 180, 180, 90, 10};</text>
<rect x="60" y="140" width="130" height="70" rx="8" fill="#fff7f2" stroke="#e8601c" stroke-width="2"/>
<text x="125" y="184" font-size="24" fill="#1f2937" font-weight="800" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">90</text>
<text x="125" y="234" font-size="14" fill="#b8470f" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">pose[0]</text>
<text x="125" y="256" font-size="12" fill="#64748b" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">BASE_ROT</text>
<text x="125" y="132" font-size="11" fill="#64748b" font-weight="normal" text-anchor="middle">+0 bytes</text>
<rect x="200" y="140" width="130" height="70" rx="8" fill="#fff7f2" stroke="#e8601c" stroke-width="2"/>
<text x="265" y="184" font-size="24" fill="#1f2937" font-weight="800" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">45</text>
<text x="265" y="234" font-size="14" fill="#b8470f" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">pose[1]</text>
<text x="265" y="256" font-size="12" fill="#64748b" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">SHOULDER</text>
<text x="265" y="132" font-size="11" fill="#64748b" font-weight="normal" text-anchor="middle">+2 bytes</text>
<rect x="340" y="140" width="130" height="70" rx="8" fill="#fff7f2" stroke="#e8601c" stroke-width="2"/>
<text x="405" y="184" font-size="24" fill="#1f2937" font-weight="800" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">180</text>
<text x="405" y="234" font-size="14" fill="#b8470f" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">pose[2]</text>
<text x="405" y="256" font-size="12" fill="#64748b" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">ELBOW</text>
<text x="405" y="132" font-size="11" fill="#64748b" font-weight="normal" text-anchor="middle">+4 bytes</text>
<rect x="480" y="140" width="130" height="70" rx="8" fill="#fff7f2" stroke="#e8601c" stroke-width="2"/>
<text x="545" y="184" font-size="24" fill="#1f2937" font-weight="800" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">180</text>
<text x="545" y="234" font-size="14" fill="#b8470f" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">pose[3]</text>
<text x="545" y="256" font-size="12" fill="#64748b" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">WRIST</text>
<text x="545" y="132" font-size="11" fill="#64748b" font-weight="normal" text-anchor="middle">+6 bytes</text>
<rect x="620" y="140" width="130" height="70" rx="8" fill="#fff7f2" stroke="#e8601c" stroke-width="2"/>
<text x="685" y="184" font-size="24" fill="#1f2937" font-weight="800" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">90</text>
<text x="685" y="234" font-size="14" fill="#b8470f" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">pose[4]</text>
<text x="685" y="256" font-size="12" fill="#64748b" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">WRIST_ROT</text>
<text x="685" y="132" font-size="11" fill="#64748b" font-weight="normal" text-anchor="middle">+8 bytes</text>
<rect x="760" y="140" width="130" height="70" rx="8" fill="#fff7f2" stroke="#e8601c" stroke-width="2"/>
<text x="825" y="184" font-size="24" fill="#1f2937" font-weight="800" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">10</text>
<text x="825" y="234" font-size="14" fill="#b8470f" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">pose[5]</text>
<text x="825" y="256" font-size="12" fill="#64748b" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">GRIPPER</text>
<text x="825" y="132" font-size="11" fill="#64748b" font-weight="normal" text-anchor="middle">+10 bytes</text>
<rect x="900" y="140" width="50" height="70" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>
<text x="925" y="184" font-size="22" fill="#dc2626" font-weight="800" text-anchor="middle">?</text>
<text x="925" y="234" font-size="12" fill="#dc2626" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">pose[6]</text>
<text x="925" y="256" font-size="11" fill="#dc2626" font-weight="normal" text-anchor="middle">out of</text>
<text x="925" y="270" font-size="11" fill="#dc2626" font-weight="normal" text-anchor="middle">bounds!</text>
<text x="32" y="306" font-size="13" fill="#64748b" font-weight="normal" text-anchor="start">Indexes start at 0 · elements sit side by side (2 bytes each on the UNO) · C++ does NOT stop you reading past the end.</text>
</svg>
